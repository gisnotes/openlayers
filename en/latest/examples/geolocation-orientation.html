<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>Mobile Geolocation Tracking with Orientation / 移动端高精度定位追踪与车头朝向导航</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/openlayers/theme/ol.css">
    <link rel="stylesheet" type="text/css" href="/openlayers/theme/site.css">
    <style>
      html, body, .map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #info {
          position: absolute;
          font-size: 0.7em;
          top: 10px;
          right: 10px;
          background-color: lightgrey;
          padding: 4px;
      }
      .geolocate-buttons {
          position: absolute;
          bottom: 40px;
          left: 10px;
      }
    </style>
  </head>
  <body>
    <div id="map" class="map"></div>
    <div id="info"></div>
    <img id="geolocation_marker" src="https://cdn.jsdelivr.net/gh/gisnotes/openlayers@gh-pages/examples/data/geolocation_marker.png" />
    <div class="geolocate-buttons">
      <button id="geolocate" class="btn btn-primary">Geolocate Me! / 开启实时定位</button>
      <button id="simulate" class="btn btn-secondary">Simulate / 轨迹模拟</button>
    </div>
    <script type="module" src="geolocation-orientation.js"></script>
  </body>
</html>
